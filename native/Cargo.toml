[package]
name = "luma-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Experimental Rust/SDL2/GLES2 implementation of Luma"

[features]
default = []
webos = ["dep:libc"]

[dependencies]
fontdue = "0.9"
gl = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = { version = "0.2", optional = true }
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset", "formatting", "parsing"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Keep bundled CJK font parsing responsive in debug previews and smoke tests.
[profile.dev.package.fontdue]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3
