name: Native prototype

on:
  push:
    branches: [main]
    paths:
      [
        'native/**',
        'public/**',
        'src/app-icons.json',
        'src/icon-colours.css',
        'src/components/connection-icon.tsx',
        'appinfo.json',
        'package.json',
        'pnpm-lock.yaml',
        '.github/workflows/native.yml',
      ]
  pull_request:
    paths:
      [
        'native/**',
        'public/**',
        'src/app-icons.json',
        'src/icon-colours.css',
        'src/components/connection-icon.tsx',
        'appinfo.json',
        'package.json',
        'pnpm-lock.yaml',
        '.github/workflows/native.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Rust checks and desktop rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev pkg-config woff2 python3-fonttools libgl1-mesa-dri xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:check
      - run: pnpm native:assets
      - name: Exercise OpenGL rendering and interaction
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' pnpm native:smoke
      - name: Upload native screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-desktop-screenshots
          path: |
            .build/native/*.png
            .build/native/*-render.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
